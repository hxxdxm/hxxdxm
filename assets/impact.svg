<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Impact: 이물 사진 900장 교차검수 PASS, 이미지 분류 Test 정확도 98.4%, 프론트엔드 16개 화면, NET 챌린지 본선 진출">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7F4"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3D5266" flood-opacity="0.14"/></filter>
    <style>
      .ko { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
      .en { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .num { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- 1. 데이터 품질 -->
  <g filter="url(#sh)"><rect x="12" y="14" width="276" height="176" rx="22" fill="url(#c1)" stroke="#DDE6E0"/></g>
  <rect x="40" y="34" width="34" height="6" rx="3" fill="#2F6B5E"/>
  <text x="40" y="66" class="en" font-size="14" font-weight="700" letter-spacing="2" fill="#2F6B5E">DATA QUALITY</text>
  <text x="38" y="118" class="num" font-size="50" fill="#1F2D3A">900<tspan font-size="30">장</tspan></text>
  <text x="40" y="150" class="ko" font-size="16" font-weight="700" fill="#2B3B48">이물 사진 전수 교차검수</text>
  <text x="40" y="173" class="ko" font-size="13.5" fill="#7A8794">900 / 900 PASS · 라벨 기준서 작성</text>

  <!-- 2. 모델 정확도 -->
  <g filter="url(#sh)"><rect x="308" y="14" width="276" height="176" rx="22" fill="url(#c1)" stroke="#DDE6E0"/></g>
  <rect x="336" y="34" width="34" height="6" rx="3" fill="#5B8A72"/>
  <text x="336" y="66" class="en" font-size="14" font-weight="700" letter-spacing="2" fill="#5B8A72">ACCURACY</text>
  <text x="334" y="118" class="num" font-size="50" fill="#1F2D3A">98.4<tspan font-size="30">%</tspan></text>
  <text x="336" y="150" class="ko" font-size="16" font-weight="700" fill="#2B3B48">이미지 분류 Test 정확도</text>
  <text x="336" y="173" class="ko" font-size="13.5" fill="#7A8794">71.9% → 98.4% · 약점 4가지 개선</text>

  <!-- 3. 웹 서비스 -->
  <g filter="url(#sh)"><rect x="604" y="14" width="276" height="176" rx="22" fill="url(#c1)" stroke="#DDE6E0"/></g>
  <rect x="632" y="34" width="34" height="6" rx="3" fill="#3D5266"/>
  <text x="632" y="66" class="en" font-size="14" font-weight="700" letter-spacing="2" fill="#3D5266">WEB SERVICE</text>
  <text x="630" y="118" class="num" font-size="50" fill="#1F2D3A">16<tspan font-size="30">개 화면</tspan></text>
  <text x="632" y="150" class="ko" font-size="16" font-weight="700" fill="#2B3B48">졸업작품 프론트엔드 구현</text>
  <text x="632" y="173" class="ko" font-size="13.5" fill="#7A8794">2인 팀 팀장 · 졸업 후 리팩터링</text>

  <!-- 4. 공모전 -->
  <g filter="url(#sh)"><rect x="900" y="14" width="288" height="176" rx="22" fill="url(#c1)" stroke="#DDE6E0"/></g>
  <rect x="928" y="34" width="34" height="6" rx="3" fill="#C9A86A"/>
  <text x="928" y="66" class="en" font-size="14" font-weight="700" letter-spacing="2" fill="#B08D4E">CONTEST</text>
  <text x="926" y="118" class="ko" font-size="44" font-weight="800" fill="#1F2D3A">본선 진출</text>
  <text x="928" y="150" class="ko" font-size="16" font-weight="700" fill="#2B3B48">NET 챌린지 캠프 시즌10</text>
  <text x="928" y="173" class="ko" font-size="13.5" fill="#7A8794">2023 · 과학기술정보통신부 주최</text>
</svg>
